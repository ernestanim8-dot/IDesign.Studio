<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>You are Offline — iDESIGN Studio</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0c09; color: #f3efe6; font-family: "Helvetica Neue", Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { max-width: 480px; text-align: center; }
    .icon { width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid #c8a54a; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.75rem; background: rgba(200,165,74,0.08); }
    .eyebrow { font-family: "Courier New", monospace; font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase; color: #c8a54a; margin-bottom: 1rem; }
    h1 { font-family: Georgia, serif; font-size: clamp(1.8rem, 5vw, 2.8rem); letter-spacing: -0.02em; color: #fff; margin-bottom: 1rem; line-height: 1.1; }
    p { font-size: 0.9rem; font-weight: 300; color: #6a6460; line-height: 1.75; margin-bottom: 2.25rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
    .btn-primary { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.85rem 2rem; background: #c8a54a; color: #fff; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; border: none; border-radius: 3px; cursor: pointer; text-decoration: none; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-secondary { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.85rem 2rem; background: transparent; color: #c8a54a; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid #c8a54a; border-radius: 3px; cursor: pointer; text-decoration: none; transition: all 0.2s; }
    .btn-secondary:hover { background: rgba(200,165,74,0.1); }
    .divider { border-top: 1px solid #1e1c18; margin: 2.25rem 0; }
    .contact-note { font-size: 0.78rem; color: #3a3830; }
    .contact-note a { color: #6a6460; }
    .contact-note a:hover { color: #c8a54a; }
  </style>
</head>

  <div class="card">

</html>
